name: Mise à jour des prédictions

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6 h UTC
  workflow_dispatch:       # permet aussi de lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python backend/update.py
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      - name: Publier les nouvelles données
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Mise à jour des prédictions"
          git push